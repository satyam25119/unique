# Netlify configuration for Unique Engineering Next.js app
# Docs: https://docs.netlify.com/frameworks/next-js/overview/

[build]
  # Use npm (Netlify's default). Prisma generate must run before next build.
  command = "npx prisma generate && npx next build"
  publish = ".next"

# The @netlify/plugin-nextjs handles ALL routing automatically:
# - Static pages → CDN
# - API routes → Netlify Functions
# - Dynamic routes → Serverless Functions
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Build environment
[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Set these in Netlify Dashboard > Site Settings > Environment Variables:
#   TURSO_DATABASE_URL = "libsql://your-db-name-xxx.turso.io"
#   TURSO_AUTH_TOKEN  = "eyJhbGciOi..."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
